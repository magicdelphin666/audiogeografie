<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audiogeografie Salzburg – Benjamin Lageder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface2: #f0eeea;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.18);
    --accent: #1a1916;
    --accent-dim: #4a4845;
    --accent-light: #e8e6e1;
    --primary-red: #d32f2f;
    --text: #1a1916;
    --text-muted: #7a7570;
    --text-faint: #b0aba5;
    --serif: 'DM Serif Display', Georgia, serif;
    --mono: 'DM Mono', 'Courier New', monospace;
    --radius: 4px;
  }
  html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; overflow: hidden; }

  #app { display: flex; height: 100vh; width: 100vw; position: relative; }

  #map { flex: 1; height: 100%; width: 100%; z-index: 1; background: #e5e3df; }
  .leaflet-container { background: #e5e3df !important; }
  .leaflet-tile { filter: grayscale(100%) contrast(85%) brightness(105%); }
  .leaflet-control-attribution { background: rgba(245,244,241,0.85) !important; color: var(--text-faint) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--text-faint) !important; }

  .custom-pin { display: flex; align-items: center; justify-content: center; }
  .pin-dot {
    width: 13px; height: 13px;
    background: var(--primary-red);
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(211,47,47,0.35);
    transition: all 0.2s ease-in-out;
  }
  .custom-pin.active .pin-dot {
    background: #ffffff;
    border: 4px solid var(--primary-red);
    transform: scale(1.4);
    box-shadow: 0 0 0 4px rgba(211,47,47,0.18), 0 3px 10px rgba(0,0,0,0.3);
  }
  .custom-pin:hover .pin-dot { transform: scale(1.25); }

  #menu-toggle {
    display: none;
    position: fixed;
    bottom: 24px; right: 16px;
    z-index: 1000;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 48px; height: 48px;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    line-height: 1;
  }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 200; }
  #overlay.open { display: block; }

  /* WELCOME MODAL */
  #welcome-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,25,22,0.4);
    backdrop-filter: blur(2px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #welcome-modal-overlay.open { display: flex; }
  
  #welcome-modal {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    position: relative;
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    animation: modalAppear 0.3s ease-out;
  }
  @keyframes modalAppear {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-scroll-content {
    overflow-y: auto;
    flex: 1;
    margin-bottom: 16px;
    padding-right: 4px;
  }
  .modal-scroll-content::-webkit-scrollbar { width: 3px; }
  .modal-scroll-content::-webkit-scrollbar-thumb { background: var(--text-faint); }

  #modal-close {
    position: absolute;
    top: 12px; right: 14px;
    background: none; border: none;
    font-size: 20px; cursor: pointer;
    color: var(--text-muted); font-family: var(--mono);
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: all 0.15s;
    z-index: 10;
  }
  #modal-close:hover { background: var(--surface2); color: var(--text); }

  .modal-subtitle-top { font-size: 10px; letter-spacing: 0.15em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 8px; }
  #welcome-modal h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; font-style: italic; color: var(--text); line-height: 1.25; margin-bottom: 14px; }
  .modal-body-text { font-size: 12px; color: var(--text-muted); line-height: 1.7; margin-bottom: 16px; white-space: pre-line; }
  .modal-instruction { font-size: 11px; color: var(--text); background: var(--surface2); border-left: 2px solid var(--primary-red); padding: 10px 12px; border-radius: 0 var(--radius) var(--radius) 0; line-height: 1.5; margin-bottom: 16px; }

  /* FÖRDERUNG HINWEIS MIT SVG-LOGO */
  .modal-funding {
    font-size: 10px;
    color: var(--text-muted);
    border-top: 0.5px solid var(--border);
    padding-top: 14px;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .city-logo-svg {
    height: 28px;
    width: auto;
    display: block;
  }

  #btn-start {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 12px; font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.05em;
    cursor: pointer; transition: background 0.15s; text-align: center;
    flex-shrink: 0;
  }
  #btn-start:hover { background: var(--accent-dim); }

  #lightbox-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
    z-index: 3000; align-items: center; justify-content: center;
    padding: 20px; cursor: zoom-out;
  }
  #lightbox-overlay.open { display: flex; }
  
  #lightbox-img {
    max-width: 90vw; max-height: 85vh;
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    object-fit: contain; cursor: default;
    animation: modalAppear 0.25s ease-out;
  }

  #lightbox-close {
    position: absolute; top: 20px; right: 24px;
    background: rgba(255, 255, 255, 0.15); border: none;
    font-size: 24px; cursor: pointer; color: #ffffff;
    font-family: var(--mono); width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background 0.15s;
  }
  #lightbox-close:hover { background: rgba(255, 255, 255, 0.3); }

  #sidebar {
    width: 320px; background: var(--surface);
    border-left: 0.5px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden; z-index: 300;
    transition: transform 0.3s ease;
    box-shadow: -2px 0 16px rgba(0,0,0,0.06);
  }

  #sidebar-top { padding: 20px 20px 16px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; background: var(--surface); }
  .project-label { font-size: 10px; letter-spacing: 0.15em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 6px; }
  #sidebar-top h1 { font-family: var(--serif); font-size: 20px; font-weight: 400; line-height: 1.2; color: var(--text); font-style: italic; }
  .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
  .count-line { margin-top: 12px; font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .count-line::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary-red); }

  #entry-list-view { flex: 1; overflow-y: auto; }
  #entry-list-view::-webkit-scrollbar { width: 3px; }
  #entry-list-view::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 2px; }

  .no-entries { padding: 32px 20px; color: var(--text-faint); font-size: 12px; line-height: 1.7; text-align: center; }

  .entry-item { padding: 14px 20px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .entry-item:hover { background: var(--surface2); }
  .entry-item.active { background: var(--accent-light); }
  .ei-title { font-family: var(--serif); font-size: 15px; font-weight: 400; color: var(--text); margin-bottom: 4px; font-style: italic; }
  .ei-meta { font-size: 10px; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 2px; padding: 1px 6px; font-size: 10px; color: var(--text-muted); }

  #detail-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  #detail-panel.open { display: flex; }
  #detail-head { padding: 12px 16px; border-bottom: 0.5px solid var(--border); display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0; background: var(--surface); }
  #btn-back { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 18px; padding: 0; margin-top: 1px; flex-shrink: 0; font-family: var(--mono); transition: color 0.15s; }
  #btn-back:hover { color: var(--text); }
  #detail-title { font-family: var(--serif); font-size: 16px; font-style: italic; color: var(--text); line-height: 1.3; flex: 1; }
