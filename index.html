<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audiogeografie Salzburg – Benjamin Lageder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface2: #f0eeea;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.18);
    --accent: #1a1916;
    --accent-dim: #4a4845;
    --accent-light: #e8e6e1;
    --text: #1a1916;
    --text-muted: #7a7570;
    --text-faint: #b0aba5;
    --serif: 'DM Serif Display', Georgia, serif;
    --mono: 'DM Mono', 'Courier New', monospace;
    --radius: 4px;
  }
  html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; overflow: hidden; }

  #app { display: flex; height: 100vh; width: 100vw; position: relative; }

  /* MAP MONOCHROME */
  #map { flex: 1; height: 100%; width: 100%; z-index: 1; }
  .leaflet-tile-container img {
    filter: grayscale(100%) invert(5%) contrast(105%) brightness(98%);
  }
  .leaflet-container { background: #e5e3df !important; }
  .leaflet-control-attribution { background: rgba(245,244,241,0.85) !important; color: var(--text-faint) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--text-faint) !important; }

  /* PINS */
  .custom-pin {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin-dot {
    width: 14px;
    height: 14px;
    background: #1a1916;
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    transition: all 0.25s ease;
  }
  .custom-pin.active .pin-dot {
    background: #ffffff;
    border: 4px solid #1a1916;
    transform: scale(1.35);
    box-shadow: 0 0 0 4px rgba(26,25,22,0.15), 0 4px 12px rgba(0,0,0,0.4);
  }
  .custom-pin:hover .pin-dot {
    transform: scale(1.2);
  }

  /* TOGGLE BUTTON (Mobile) */
  #menu-toggle {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 16px;
    z-index: 1000;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    line-height: 1;
